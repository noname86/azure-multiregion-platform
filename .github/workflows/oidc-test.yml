name: OIDC login test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show subscription
        run: az account show --query "{name:name, user:user.name}" -o table

      - name: Check access to Terraform state storage
        run: |
          az storage blob list \
            --account-name sttfstate73004 \
            --container-name tfstate \
            --auth-mode login \
            -o table