apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: demo
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    annotations:
      # Place the gateway on an internal Azure load balancer, inside the VNet.
      # It will only be reachable from Front Door through Private Link.
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same